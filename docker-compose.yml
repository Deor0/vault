services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports:
      # Bound to localhost only: these are local development credentials.
      - "127.0.0.1:5432:5432"
    volumes:
      - vault-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vault-db:
